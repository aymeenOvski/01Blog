<div class="login-wrapper auth-page-wrapper d-flex align-items-center justify-content-center">
  <div class="card login-card border-0 shadow-lg p-3" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4">
      <h3 class="card-title text-center text-white mb-4">Login</h3>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label text-secondary small">Username <span class="text-danger">*</span></label>
          <input 
            id="username" 
            type="text" 
            class="form-control custom-input" 
            [class.is-invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
            formControlName="username" 
            autocomplete="off"
          />
          <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="invalid-feedback">
            <span *ngIf="loginForm.get('username')?.errors?.['required']">Username is required.</span>
            <span *ngIf="loginForm.get('username')?.errors?.['minlength']">Must be at least 3 characters.</span>
            <span *ngIf="loginForm.get('username')?.errors?.['maxlength']">Cannot exceed 50 characters.</span>
            <span *ngIf="loginForm.get('username')?.errors?.['pattern']">Only letters, numbers, and underscores allowed.</span>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label text-secondary small">Password <span class="text-danger">*</span></label>
          <input 
            id="password" 
            type="password" 
            class="form-control custom-input" 
            [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            formControlName="password" 
            autocomplete="current-password"
          />
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="invalid-feedback">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Must be at least 8 characters.</span>
            <span *ngIf="loginForm.get('password')?.errors?.['maxlength']">Cannot exceed 100 characters.</span>
          </div>
        </div>

        <!-- API Error -->
        <div *ngIf="errorMessage" class="alert alert-danger py-2 mb-3" role="alert">
          {{ errorMessage }}
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-custom-primary w-100 py-2.5 fw-semibold" [disabled]="loginForm.invalid || loading">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <p class="text-center text-secondary mt-3 mb-0">
        Don't have an account? <a routerLink="/register" class="text-primary text-decoration-none fw-semibold ms-1">Register here</a>
      </p>
    </div>
  </div>
</div>
