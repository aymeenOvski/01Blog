<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Create Post</h3>
      <button type="button" class="btn-close-icon" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body">
      <textarea
        class="post-textarea"
        rows="4"
        maxlength="2000"
        [placeholder]="mediaPreviews.length > 0 ? 'Add a caption... (optional)' : 'What\'s on your mind? Share your progress...'"
        [(ngModel)]="content"
      ></textarea>

      <div class="d-flex justify-content-end text-muted small mt-1">
        <span>{{ content ? content.length : 0 }}/2000</span>
      </div>

      <div *ngIf="mediaPreviews.length > 0" class="media-preview-container">
        <div *ngFor="let item of mediaPreviews; let i = index" class="position-relative d-inline-block">
          <button type="button" class="btn-remove-media" (click)="removeMedia(i)">
            <i class="bi bi-x-circle-fill"></i>
          </button>

          <img *ngIf="item.type === 'image'" [src]="item.url" alt="Media preview" class="preview-media" />
          <video *ngIf="item.type === 'video'" [src]="item.url" controls class="preview-media"></video>
        </div>
      </div>

      <div class="file-upload-bar" *ngIf="mediaPreviews.length < 5">
        <label for="media-file-input" class="upload-label">
          <i class="bi bi-image me-2"></i> Add Photos/Videos ({{ mediaPreviews.length }}/5)
        </label>
        <input
          type="file"
          id="media-file-input"
          multiple
          accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime"
          (change)="onFileSelected($event)"
          hidden
        />
      </div>
    </div>

    <div class="modal-footer">
      <p class="submit-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
      
      <button
        type="button"
        class="btn-submit"
        [disabled]="!isValidPost"
        (click)="onSubmit()"
      >
        {{ isSubmitting ? 'Publishing...' : 'Publish' }}
      </button>
    </div>
  </div>
</div>
