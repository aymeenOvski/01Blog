<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Create Post</h3>
      <button type="button" class="btn-close-icon" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body">
      <!-- Placeholder dynamically indicates that text is optional if media is attached -->
      <textarea
        class="post-textarea"
        rows="4"
        maxlength="2000"
        [placeholder]="selectedFile ? 'Add a caption... (optional)' : 'What\'s on your mind? Share your progress...'"
        [(ngModel)]="content"
      ></textarea>

      <div class="d-flex justify-content-end text-muted small mt-1">
        <span>{{ content ? content.length : 0 }}/2000</span>
      </div>

      <!-- Media Preview Section -->
      <div *ngIf="mediaPreviewUrl" class="media-preview-container">
        <button type="button" class="btn-remove-media" (click)="removeMedia()">
          <i class="bi bi-x-circle-fill"></i>
        </button>

        <img *ngIf="mediaType === 'image'" [src]="mediaPreviewUrl" alt="Media preview" class="preview-media" />
        <video *ngIf="mediaType === 'video'" [src]="mediaPreviewUrl" controls class="preview-media"></video>
      </div>

      <!-- File Attachment Bar -->
      <div class="file-upload-bar">
        <label for="media-file-input" class="upload-label">
          <i class="bi bi-image me-2"></i> Add Photo/Video
        </label>
        <input
          type="file"
          id="media-file-input"
          accept="image/jpeg,image/png,image/gif,image/webp ,video/webm,video/quicktime"
          (change)="onFileSelected($event)"
          hidden
        />
      </div>
    </div>

    <div class="modal-footer">
      <p class="submit-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
      
      <button
        type="button"
        class="btn-submit"
        [disabled]="(!content.trim() && !selectedFile) || (content && content.length > 2000) || isSubmitting"
        (click)="onSubmit()"
      >
        {{ isSubmitting ? 'Publishing...' : 'Publish' }}
      </button>
    </div>
  </div>
</div>
