<div class="settings-page">
  <div class="settings-card">

    <!-- Tab Header -->
    <div class="tabs-header">
      <button type="button" (click)="activeTab = 'profile'" [class.active]="activeTab === 'profile'" class="tab-btn">
        Profile
      </button>
      <button type="button" (click)="activeTab = 'account'" [class.active]="activeTab === 'account'" class="tab-btn">
        Account
      </button>
    </div>

    <!-- TAB 1: PROFILE -->
    <div *ngIf="activeTab === 'profile'" class="tab-content">
      <div class="avatar-section">
        <div class="avatar-circle">
          <svg *ngIf="!profileData.avatarUrl" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
          </svg>
          <img *ngIf="profileData.avatarUrl" [src]="profileData.avatarUrl" alt="Avatar" />
        </div>

        <input 
          type="file" 
          #fileInput 
          (change)="onFileSelected($event)" 
          style="display: none" 
          accept="image/jpeg,image/png,image/webp" 
        />

        <button type="button" class="btn-avatar" (click)="fileInput.click()">
          Change Avatar
        </button>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input 
          type="text" 
          [(ngModel)]="profileData.username" 
          name="username" 
          minlength="3"
          maxlength="50"
          pattern="^[a-zA-Z0-9_]+$"
          class="form-input" 
        />
      </div>

      <div class="form-group">
        <label>Bio</label>
        <textarea 
          rows="3" 
          [(ngModel)]="profileData.bio" 
          name="bio" 
          maxlength="250"
          class="form-input textarea"
        ></textarea>
        <div class="text-end text-secondary small mt-1">
          <span>{{ bioLength }}/250</span>
        </div>
      </div>

      <div *ngIf="statusMessage" [class]="isError ? 'message error' : 'message success'">
        {{ statusMessage }}
      </div>

      <button 
        type="button" 
        (click)="saveProfile()" 
        [disabled]="!isProfileValid" 
        class="btn-primary"
      >
        {{ loading ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>

    <!-- TAB 2: ACCOUNT -->
    <div *ngIf="activeTab === 'account'" class="tab-content">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [value]="accountData.email" disabled class="form-input disabled" />
      </div>

      <div class="form-group">
        <label>Current Password</label>
        <input 
          type="password" 
          [(ngModel)]="passwordData.currentPassword" 
          name="currentPassword" 
          placeholder="••••••••"
          autocomplete="new-password" 
          class="form-input" 
        />
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input 
          type="password" 
          [(ngModel)]="passwordData.newPassword" 
          name="newPassword" 
          minlength="8"
          maxlength="100"
          autocomplete="new-password" 
          class="form-input" 
        />
      </div>

      <div *ngIf="statusMessage" [class]="isError ? 'message error' : 'message success'">
        {{ statusMessage }}
      </div>

      <button 
        type="button" 
        (click)="updatePassword()" 
        [disabled]="!isPasswordValid" 
        class="btn-primary btn-purple"
      >
        {{ loading ? 'Updating...' : 'Update Password' }}
      </button>
    </div>

  </div>
</div>
