# Tell Spring Boot where your local PostgreSQL lives
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/myblog
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Allow Hibernate to automatically map your Java classes into relational tables (`ddl-auto= update` is risky in production!!!) -> we are using flyway for migrations instead.
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
