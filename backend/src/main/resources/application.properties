# Tell Spring Boot where your local PostgreSQL lives
spring.datasource.url=jdbc:postgresql://localhost:5433/myblog
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
app.base-url=http://localhost:8080

# Allow Hibernate to automatically map your Java classes into relational tables (`ddl-auto= update` is risky in production!!!) -> we are using flyway for migrations instead.
spring.jpa.hibernate.ddl-auto=validate 
spring.flyway.repair-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB